<title>MPLADS Risk Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root {
  color-scheme: light;
  --ground:#eef1f5; --surface:#ffffff; --surface-2:#f7f9fb; --surface-3:#eceff4;
  --ink:#11151d; --ink-2:#464e5d; --muted:#78808f; --line:#d9dee6; --line-strong:#c2c9d4;
  --accent:#1d4e8f; --accent-2:#2a78d6; --accent-wash:#e6edf7;
  --low:#0f8f63; --moderate:#b57c00; --high:#c94f1f; --critical:#c53a39;
  --low-wash:#e3f4ed; --moderate-wash:#fbf0d9; --high-wash:#fbe9e0; --critical-wash:#fbe4e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --grid:#e7ebf1; --shadow:0 1px 2px rgba(17,21,29,.06), 0 8px 24px -12px rgba(17,21,29,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:#0d1017; --surface:#161a23; --surface-2:#1b202b; --surface-3:#222836;
    --ink:#f1f4f9; --ink-2:#aeb7c6; --muted:#7d8695; --line:#28303e; --line-strong:#38424f;
    --accent:#5b9be8; --accent-2:#3987e5; --accent-wash:#182437;
    --low:#28b481; --moderate:#d9a53a; --high:#e5834f; --critical:#e66767;
    --low-wash:#12281f; --moderate-wash:#2a2312; --high-wash:#2d1e15; --critical-wash:#2d1717;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --grid:#232b38; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0d1017; --surface:#161a23; --surface-2:#1b202b; --surface-3:#222836;
  --ink:#f1f4f9; --ink-2:#aeb7c6; --muted:#7d8695; --line:#28303e; --line-strong:#38424f;
  --accent:#5b9be8; --accent-2:#3987e5; --accent-wash:#182437;
  --low:#28b481; --moderate:#d9a53a; --high:#e5834f; --critical:#e66767;
  --low-wash:#12281f; --moderate-wash:#2a2312; --high-wash:#2d1e15; --critical-wash:#2d1717;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --grid:#232b38; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 { font-family:"Zilla Slab", Georgia, serif; margin:0; text-wrap:balance; font-weight:600; }
a { color:var(--accent); }
.mono { font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums; }
.num { font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums; }

/* ------------------------------------------------------------------ shell */
.app { display:grid; grid-template-columns:246px 1fr; min-height:100vh; }
.rail {
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand { padding:4px 10px 14px; border-bottom:1px solid var(--line); margin-bottom:12px; }
.brand .mark {
  font-family:"Zilla Slab", Georgia, serif; font-weight:700; font-size:19px; letter-spacing:-.2px;
  display:flex; align-items:center; gap:8px;
}
.brand .mark span.seal {
  width:26px; height:26px; border-radius:5px; background:var(--accent); color:#fff;
  display:grid; place-items:center; font-size:12px; letter-spacing:.5px;
}
.brand .sub { color:var(--muted); font-size:11.5px; margin-top:6px; letter-spacing:.02em; }
.navitem {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px; border-radius:8px; border:none; background:none; width:100%;
  color:var(--ink-2); font:inherit; font-size:13.5px; cursor:pointer; text-align:left;
}
.navitem:hover { background:var(--surface-2); color:var(--ink); }
.navitem[aria-current="true"] { background:var(--accent-wash); color:var(--accent); font-weight:600; }
.navitem .count { font-size:11px; color:var(--muted); font-family:"IBM Plex Mono",monospace; }
.navgroup { font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); padding:14px 10px 6px; }
.railfoot { margin-top:auto; padding:14px 10px 0; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }

.main { min-width:0; display:flex; flex-direction:column; }
.topbar {
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.topbar h1 { font-size:19px; }
.topbar .crumb { color:var(--muted); font-size:12px; }
.provenance { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.chip {
  font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line-strong);
  color:var(--ink-2); background:var(--surface); white-space:nowrap;
  font-family:"IBM Plex Mono", monospace;
}
.chip.warn { border-color:var(--moderate); color:var(--moderate); background:var(--moderate-wash); }
.chip.ok { border-color:var(--low); color:var(--low); background:var(--low-wash); }
.iconbtn { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);
  border-radius:8px; padding:5px 9px; cursor:pointer; font:inherit; font-size:12px; }
.iconbtn:hover { border-color:var(--accent); color:var(--accent); }

.view { padding:22px 26px 60px; display:none; }
.view.active { display:block; }
.section-title { display:flex; align-items:baseline; gap:10px; margin:26px 0 12px; }
.section-title h2 { font-size:16px; }
.section-title .hint { color:var(--muted); font-size:12px; }

/* ------------------------------------------------------------------ cards */
.grid { display:grid; gap:14px; }
.kpis { grid-template-columns:repeat(auto-fit, minmax(198px,1fr)); }
.card {
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); min-width:0;
}
.kpi .label { font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
.kpi .value { font-family:"IBM Plex Mono",monospace; font-size:clamp(18px,2.1vw,24px); font-weight:600;
  letter-spacing:-.6px; margin-top:6px; font-variant-numeric:tabular-nums; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.kpi .value .unit { font-size:13px; color:var(--ink-2); font-weight:500; margin-left:3px; }
.kpi .foot { font-size:11.5px; color:var(--muted); margin-top:5px; }
.kpi.sev-high .value { color:var(--high); }
.kpi.sev-critical .value { color:var(--critical); }

.meter { height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:10px; display:flex; gap:2px; }
.meter i { display:block; height:100%; }

/* ---------------------------------------------------------------- tables */
.tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
th {
  position:sticky; top:0; background:var(--surface-2); z-index:1; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); font-weight:600; cursor:pointer; user-select:none;
}
th.sorted::after { content:"▾"; margin-left:5px; color:var(--accent); }
th.sorted.asc::after { content:"▴"; }
tbody tr:hover { background:var(--surface-2); }
tbody tr.clickable { cursor:pointer; }
td.num, th.num { text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
td.wrap { white-space:normal; min-width:280px; max-width:460px; }
.emptyrow td { color:var(--muted); text-align:center; padding:26px; }

.pill {
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:999px; border:1px solid currentColor; letter-spacing:.02em;
}
.pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.LOW { color:var(--low); background:var(--low-wash); }
.pill.MODERATE { color:var(--moderate); background:var(--moderate-wash); }
.pill.HIGH { color:var(--high); background:var(--high-wash); }
.pill.CRITICAL { color:var(--critical); background:var(--critical-wash); }
.stripe { display:inline-block; width:3px; height:15px; border-radius:2px; vertical-align:-3px; margin-right:7px; }
.stripe.LOW{background:var(--low)} .stripe.MODERATE{background:var(--moderate)}
.stripe.HIGH{background:var(--high)} .stripe.CRITICAL{background:var(--critical)}

.bar-cell { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
.bar-cell .track { width:70px; height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; }
.bar-cell .fill { height:100%; border-radius:3px; background:var(--accent-2); }

/* ---------------------------------------------------------------- controls */
.controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
input[type="search"], select, input[type="text"] {
  font:inherit; font-size:13px; padding:7px 10px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); min-width:150px;
}
input:focus-visible, select:focus-visible, button:focus-visible, tr:focus-visible {
  outline:2px solid var(--accent); outline-offset:1px;
}
.seg { display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
.seg button { border:none; background:var(--surface); color:var(--ink-2); font:inherit; font-size:12.5px;
  padding:7px 12px; cursor:pointer; border-right:1px solid var(--line); }
.seg button:last-child { border-right:none; }
.seg button[aria-pressed="true"] { background:var(--accent-wash); color:var(--accent); font-weight:600; }

/* ----------------------------------------------------------------- charts */
.chartcard h3 { font-size:14px; margin-bottom:2px; }
.chartcard .caption { font-size:11.5px; color:var(--muted); margin-bottom:12px; }
svg { display:block; width:100%; height:auto; overflow:visible; }
.axis text { font-family:"IBM Plex Mono",monospace; font-size:9.5px; fill:var(--muted); }
.axis line, .axis path { stroke:var(--line); }
.gridline { stroke:var(--grid); stroke-width:1; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-top:10px; }
.legend .key { display:inline-flex; align-items:center; gap:6px; }
.legend .swatch { width:11px; height:11px; border-radius:3px; }
.tooltip {
  position:fixed; pointer-events:none; z-index:80; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:8px; padding:9px 11px; font-size:12px; box-shadow:var(--shadow); max-width:290px; opacity:0;
  transition:opacity .12s ease;
}
.tooltip .t-title { font-weight:600; margin-bottom:5px; font-size:12px; }
.tooltip .t-row { display:flex; justify-content:space-between; gap:14px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; }
.tooltip .t-row span:first-child { color:var(--ink-2); }

/* ----------------------------------------------------------------- drawer */
.drawer-backdrop {
  position:fixed; inset:0; background:rgba(8,11,16,.42); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s;
}
.drawer-backdrop.open { opacity:1; pointer-events:auto; }
.drawer {
  position:fixed; top:0; right:0; height:100vh; width:min(560px,94vw); background:var(--surface);
  border-left:1px solid var(--line); z-index:61; transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; padding:22px 24px 60px;
}
.drawer.open { transform:none; }
.drawer h2 { font-size:17px; margin-bottom:4px; }
.drawer .meta { color:var(--muted); font-size:12px; margin-bottom:16px; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:12.5px; margin:12px 0; }
.kv dt { color:var(--muted); }
.kv dd { margin:0; font-family:"IBM Plex Mono",monospace; text-align:right; }
.compbar { display:grid; grid-template-columns:132px 1fr 42px; gap:9px; align-items:center; font-size:12px; margin:7px 0; }
.compbar .track { height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden; }
.compbar .fill { height:100%; border-radius:4px; }
.explain {
  background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:8px; padding:13px 15px; font-size:13px; line-height:1.62; margin:14px 0;
}
.callout {
  border:1px solid var(--line); border-left:3px solid var(--moderate); background:var(--moderate-wash);
  border-radius:8px; padding:12px 15px; font-size:12.5px; line-height:1.6; color:var(--ink-2);
}
.callout.neutral { border-left-color:var(--accent); background:var(--accent-wash); }
.note { font-size:12px; color:var(--muted); line-height:1.6; }
ul.clean { margin:8px 0; padding-left:18px; }
ul.clean li { margin:6px 0; font-size:12.8px; line-height:1.55; color:var(--ink-2); }

/* -------------------------------------------------------------- assistant */
.chat { display:flex; flex-direction:column; gap:12px; max-height:460px; overflow-y:auto; padding-right:4px; }
.msg { max-width:88%; padding:11px 14px; border-radius:12px; font-size:13px; line-height:1.55; }
.msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px; }
.msg.bot { align-self:flex-start; background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:3px; }
.msg.bot pre { margin:8px 0 0; font-family:"IBM Plex Mono",monospace; font-size:11.5px; white-space:pre-wrap;
  background:var(--surface-3); padding:9px; border-radius:6px; overflow-x:auto; }
.msg .src { font-size:10.5px; color:var(--muted); margin-top:7px; font-family:"IBM Plex Mono",monospace; }
.suggest { display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
.suggest button { font:inherit; font-size:12px; padding:6px 11px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink-2); cursor:pointer; }
.suggest button:hover { border-color:var(--accent); color:var(--accent); }

.flow { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.flow .step {
  border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:var(--surface-2);
  font-size:12px; flex:1 1 190px; min-width:0;
}
.flow .step b { display:block; font-family:"Zilla Slab",serif; font-size:12.5px; margin-bottom:3px; }
.flow .step span { color:var(--muted); font-size:11.5px; line-height:1.45; display:block; }

@media (max-width: 900px) {
  .app { grid-template-columns:1fr; }
  .rail { position:static; height:auto; flex-direction:row; overflow-x:auto; gap:4px; padding:10px; }
  .brand, .railfoot, .navgroup { display:none; }
  .navitem { width:auto; white-space:nowrap; }
  .view { padding:16px 14px 50px; }
  .topbar { padding:12px 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">
      <div class="mark"><span class="seal">MP</span> MPLADS Monitor</div>
      <div class="sub">AI-assisted anomaly, risk &amp; inefficiency detection</div>

    <button class="navitem" data-view="overview" aria-current="true">Ministry overview</button>

    <div class="navgroup">Entities</div>

  <div class="main">

    </header>

    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-risk"></section>
    <section class="view" id="view-alerts"></section>
    <section class="view" id="view-states"></section>
    <section class="view" id="view-mps"></section>
    <section class="view" id="view-vendors"></section>
    <section class="view" id="view-duplicates"></section>
    <section class="view" id="view-quality"></section>
    <section class="view" id="view-method"></section>
    <section class="view" id="view-assistant"></section>
  </div>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Record detail"></aside>
<div class="tooltip" id="tooltip" role="status"></div>

<script>
const D = JSON.parse(document.getElementById('mplads-payload').textContent);
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const BANDS = ['LOW','MODERATE','HIGH','CRITICAL'];
const COMPONENTS = [
  ['cost_risk','Cost vs comparable works'], ['duplicate_risk','Duplicate / repeated work'],
  ['delay_risk','Open beyond typical age'], ['vendor_risk','Vendor concentration'],
  ['utilisation_risk','Fund utilisation'], ['data_quality_risk','Data quality']
];

/* ------------------------------------------------------------- formatting */
const cr = v => (v == null || isNaN(v)) ? '—' : '₹' + (v/1e7).toLocaleString('en-IN',{maximumFractionDigits:2}) + ' cr';
const crK = v => (v == null || isNaN(v)) ? '—' : '₹' + Math.round(v/1e7).toLocaleString('en-IN') + ' cr';
const money = v => {
  if (v == null || isNaN(v)) return '—';
  if (Math.abs(v) >= 1e7) return '₹' + (v/1e7).toLocaleString('en-IN',{maximumFractionDigits:2}) + ' cr';
  if (Math.abs(v) >= 1e5) return '₹' + (v/1e5).toLocaleString('en-IN',{maximumFractionDigits:2}) + ' L';
  return '₹' + Math.round(v).toLocaleString('en-IN');
};
const n0 = v => (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString('en-IN');
const n1 = v => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(1);
const pct = v => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(1) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bandVar = b => ({LOW:'var(--low)',MODERATE:'var(--moderate)',HIGH:'var(--high)',CRITICAL:'var(--critical)'}[b] || 'var(--muted)');
const pill = b => `<span class="pill ${b}">${b.charAt(0)+b.slice(1).toLowerCase()}</span>`;

/* ------------------------------------------------------------- tooltip */
const tip = $('#tooltip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.opacity = '1';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, window.innerWidth - r.width - 12) + 'px';
  tip.style.top = Math.min(y + 14, window.innerHeight - r.height - 12) + 'px';
}
const hideTip = () => { tip.style.opacity = '0'; };

/* ------------------------------------------------------------- charts */
function svgEl(w, h) {
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">`;
}
function lineChart(series, opts) {
  const W = 760, H = 260, m = {l:58, r:14, t:12, b:28};
  const months = series[0].points.map(p => p.x);
  const maxY = Math.max(...series.flatMap(s => s.points.map(p => p.y))) || 1;
  const x = i => m.l + i * (W - m.l - m.r) / Math.max(months.length - 1, 1);
  const y = v => H - m.b - (v / maxY) * (H - m.t - m.b);
  const ticks = 4;
  let g = '';
  for (let t = 0; t <= ticks; t++) {
    const v = maxY * t / ticks;
    g += `<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/>
          <text class="axis-label" x="${m.l-8}" y="${y(v)+3}" text-anchor="end" font-size="9.5"
                font-family="IBM Plex Mono, monospace" fill="var(--muted)">${opts.fmt(v)}</text>`;
  }
  let xl = '';
  const step = Math.ceil(months.length / 9);
  months.forEach((mo, i) => {
    if (i % step === 0 || i === months.length - 1) {
      xl += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9.5"
              font-family="IBM Plex Mono, monospace" fill="var(--muted)">${mo}</text>`;
    }
  });
  let paths = '';
  series.forEach(s => {
    const d = s.points.map((p,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.points.length - 1;
    paths += `<circle cx="${x(last)}" cy="${y(s.points[last].y)}" r="4" fill="${s.color}"
              stroke="var(--surface)" stroke-width="2"/>`;
  });
  let hot = '';
  months.forEach((mo,i) => {
    hot += `<rect x="${x(i) - (W-m.l-m.r)/months.length/2}" y="${m.t}"
            width="${(W-m.l-m.r)/months.length}" height="${H-m.t-m.b}" fill="transparent"
            data-i="${i}" class="hotspot"/>`;
  });
  return `${svgEl(W,H)}<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>
    ${g}${xl}${paths}<g class="crosshair" style="display:none"><line stroke="var(--line-strong)"
    stroke-width="1" stroke-dasharray="3 3" y1="${m.t}" y2="${H-m.b}"/></g>${hot}</svg>`;
}
function attachLineHover(root, series, fmt) {
  const svg = $('svg', root); if (!svg) return;
  const cross = $('.crosshair', svg), cl = $('line', cross);
  $$('.hotspot', svg).forEach(r => {
    r.addEventListener('mousemove', ev => {
      const i = +r.dataset.i, cx = +r.getAttribute('x') + (+r.getAttribute('width'))/2;
      cross.style.display = ''; cl.setAttribute('x1', cx); cl.setAttribute('x2', cx);
      showTip(`<div class="t-title">${series[0].points[i].x}</div>` +
        series.map(s => `<div class="t-row"><span><span class="legend-dot" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:5px"></span>${s.name}</span><span>${fmt(s.points[i].y)}</span></div>`).join(''),
        ev.clientX, ev.clientY);
    });
    r.addEventListener('mouseleave', () => { cross.style.display='none'; hideTip(); });
  });
}
function barChart(items, opts={}) {
  const W = 760, barH = 26, gap = 8, m = {l:opts.labelWidth||168, r:56, t:6, b:6};
  const H = m.t + m.b + items.length*(barH+gap);
  const maxV = Math.max(...items.map(i => i.value), opts.min || 1);
  let out = svgEl(W,H);
  items.forEach((it, i) => {
    const yy = m.t + i*(barH+gap);
    const w = Math.max(2, (it.value/maxV) * (W - m.l - m.r));
    out += `<text x="${m.l-12}" y="${yy+barH/2+4}" text-anchor="end" font-size="11.5"
             font-family="IBM Plex Sans, sans-serif" fill="var(--ink-2)">${esc(it.label)}</text>
            <rect x="${m.l}" y="${yy+6}" width="${W-m.l-m.r}" height="${barH-12}" rx="4" fill="var(--surface-3)"/>
            <rect x="${m.l}" y="${yy+6}" width="${w}" height="${barH-12}" rx="4" fill="${it.color||'var(--s1)'}">
              <title>${esc(it.label)}: ${esc(it.display||it.value)}</title></rect>
            <text x="${W-m.r+10}" y="${yy+barH/2+4}" font-size="11" font-family="IBM Plex Mono, monospace"
             fill="var(--ink-2)">${esc(it.display ?? it.value)}</text>`;
  });
  return out + '</svg>';
}
function histogram(edges, counts, colorFor) {
  const W = 760, H = 190, m = {l:52, r:12, t:10, b:26};
  const maxC = Math.max(...counts) || 1;
  const bw = (W - m.l - m.r) / counts.length;
  let out = svgEl(W,H);
  for (let t=0; t<=3; t++) {
    const v = maxC*t/3, yy = H-m.b-(v/maxC)*(H-m.t-m.b);
    out += `<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/>
            <text x="${m.l-8}" y="${yy+3}" text-anchor="end" font-size="9.5"
             font-family="IBM Plex Mono, monospace" fill="var(--muted)">${n0(v)}</text>`;
  }
  counts.forEach((c,i) => {
    const h = (c/maxC)*(H-m.t-m.b), mid = (edges[i]+edges[i+1])/2;
    out += `<rect x="${m.l+i*bw+1}" y="${H-m.b-h}" width="${bw-2}" height="${Math.max(h,0)}" rx="3"
             fill="${colorFor(mid)}"><title>${edges[i]}–${edges[i+1]} risk: ${n0(c)} works</title></rect>`;
  });
  [0,25,50,75,100].forEach(v => {
    out += `<text x="${m.l+(v/100)*(W-m.l-m.r)}" y="${H-8}" text-anchor="middle" font-size="9.5"
             font-family="IBM Plex Mono, monospace" fill="var(--muted)">${v}</text>`;
  });
  return out + '</svg>';
}
function scatter(points, opts) {
  const W = 760, H = 330, m = {l:52, r:16, t:12, b:38};
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const xMax = Math.max(...xs, 1), yMax = Math.max(...ys, 1);
  const X = v => m.l + (v/xMax)*(W-m.l-m.r), Y = v => H-m.b-(v/yMax)*(H-m.t-m.b);
  let out = svgEl(W,H);
  for (let t=0;t<=4;t++) {
    const v = yMax*t/4;
    out += `<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/>
            <text x="${m.l-8}" y="${Y(v)+3}" text-anchor="end" font-size="9.5"
             font-family="IBM Plex Mono, monospace" fill="var(--muted)">${Math.round(v)}</text>`;
  }
  for (let t=0;t<=4;t++) {
    const v = xMax*t/4;
    out += `<text x="${X(v)}" y="${H-18}" text-anchor="middle" font-size="9.5"
             font-family="IBM Plex Mono, monospace" fill="var(--muted)">${Math.round(v)}</text>`;
  }
  points.forEach(p => {
    out += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.r||4.5}" fill="${p.color}"
             fill-opacity=".82" stroke="var(--surface)" stroke-width="2"><title>${esc(p.label)}</title></circle>`;
  });
  out += `<text x="${(W)/2}" y="${H-2}" text-anchor="middle" font-size="10.5"
           font-family="IBM Plex Sans, sans-serif" fill="var(--muted)">${esc(opts.xLabel)}</text>`;
  out += `<text transform="translate(12,${H/2}) rotate(-90)" text-anchor="middle" font-size="10.5"
           font-family="IBM Plex Sans, sans-serif" fill="var(--muted)">${esc(opts.yLabel)}</text>`;
  return out + '</svg>';
}
function stackedBands(counts, total) {
  let out = '<div class="meter" style="height:14px">';
  BANDS.forEach(b => {
    const share = 100*(counts[b]||0)/Math.max(total,1);
    if (share > 0) out += `<i style="width:${share}%;background:${bandVar(b)}" title="${b}: ${n0(counts[b])}"></i>`;
  });
  return out + '</div>';
}
const legend = items => `<div class="legend">${items.map(i =>

/* --------------------------------------------------------------- tables */
function table(container, rows, cols, opts={}) {
  const state = {sort: opts.sort || cols[0].key, asc: opts.asc ?? false, q: '', filter: opts.filter || (()=>true)};
  function render() {
    let data = rows.filter(state.filter);
    if (state.q) {
      const q = state.q.toLowerCase();
      data = data.filter(r => cols.some(c => String(r[c.key] ?? '').toLowerCase().includes(q)));
    }
    data = data.slice().sort((a,b) => {
      const va = a[state.sort], vb = b[state.sort];
      const cmp = (typeof va === 'number' && typeof vb === 'number')
        ? (va||0)-(vb||0) : String(va ?? '').localeCompare(String(vb ?? ''));
      return state.asc ? cmp : -cmp;
    });
    const shown = data.slice(0, opts.limit || 200);
    const head = cols.map(c => `<th class="${c.num?'num':''} ${state.sort===c.key?'sorted '+(state.asc?'asc':''):''}"
                                 data-key="${c.key}">${esc(c.label)}</th>`).join('');
    const body = shown.length ? shown.map((r,i) => `<tr class="${opts.onRow?'clickable':''}" data-i="${rows.indexOf(r)}" ${opts.onRow?'tabindex="0"':''}>` +
      cols.map(c => `<td class="${c.num?'num':''} ${c.wrap?'wrap':''}">${c.render ? c.render(r) : esc(r[c.key] ?? '—')}</td>`).join('') + '</tr>').join('')
      : '<tr class="emptyrow"><td colspan="'+cols.length+'">No records match these filters.</td></tr>';
    container.innerHTML = `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="note" style="margin-top:8px">${n0(shown.length)} of ${n0(data.length)} matching records shown${opts.footnote?' · '+opts.footnote:''}</div>`;
    $$('th', container).forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (state.sort === k) state.asc = !state.asc; else { state.sort = k; state.asc = false; }
      render();
    }));
    if (opts.onRow) $$('tbody tr.clickable', container).forEach(tr => {
      const act = () => opts.onRow(rows[+tr.dataset.i]);
      tr.addEventListener('click', act);
      tr.addEventListener('keydown', e => { if (e.key === 'Enter') act(); });
    });
  }
  render();
  return { search: v => { state.q = v; render(); }, setFilter: f => { state.filter = f; render(); }, refresh: render };
}

  }).join('');
}

      ${(D.linkage.unsupported_joins || []).map(u => `<div class="callout" style="margin-top:10px">${esc(u)}</div>`).join('')}
    </div>

    <div class="section-title"><h2>Risk model</h2><span class="hint">every threshold below is configuration, not code</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card">
        <h3 style="font-size:13px;margin-bottom:8px">Component weights</h3>
        ${barChart(Object.entries(D.config.risk_weights).map(([k,v]) =>
          ({label:k.replace(/_/g,' '), value:v*100, display:(v*100).toFixed(0)+'%', color:'var(--s1)'})),
          {labelWidth:170, min:30})}
        <div class="note" style="margin-top:10px">The composite blends the weighted average with the single
          strongest component, so one severe, well-evidenced deviation is not averaged away. The unsupervised
          ensemble may corroborate a score but can never create one.</div>
      </div>
      <div class="card">
        <h3 style="font-size:13px;margin-bottom:8px">Detection stack</h3>
        <ul class="clean">
          <li><b>Robust statistics</b> — modified z (median/MAD) and IQR fences inside (state, category) and district peer groups.</li>
          <li><b>Isolation Forest</b> — contamination ${D.config.iforest_contamination}, set from the extreme-value rate measured during EDA.</li>
          <li><b>Local Outlier Factor</b> — density deviation for records that are normal nationally but odd locally.</li>
          <li><b>DBSCAN</b> — records belonging to no dense cluster.</li>
          <li><b>Rules</b> — repeated payment lines, round-number bias, single-vendor district capture, long-open works.</li>
          <li><b>NLP</b> — character n-gram TF-IDF cosine similarity above ${(100*D.config.similarity_threshold).toFixed(0)}%, blocked by state.</li>
        </ul>
      </div>
    </div>

    <div class="section-title"><h2>Predictive model — and what is deliberately not modelled</h2></div>
    <div class="card">
      ${m.trained ? `<dl class="kv" style="max-width:520px">
        <dt>Model</dt><dd>${esc(m.model)}</dd>
        <dt>Target</dt><dd style="text-align:left">${esc(m.target)}</dd>
        <dt>Split</dt><dd style="text-align:left">${esc(m.split)}</dd>
        <dt>ROC-AUC</dt><dd>${m.metrics.roc_auc}</dd>
        <dt>Average precision</dt><dd>${m.metrics.average_precision}</dd>
        <dt>Precision / recall / F1</dt><dd>${m.metrics.precision} · ${m.metrics.recall} · ${m.metrics.f1}</dd>
        <dt>False-positive rate</dt><dd>${m.metrics.false_positive_rate}</dd>
        <dt>Brier score</dt><dd>${m.metrics.brier_score}</dd>
      </dl>
      <div class="note" style="margin-top:8px">${esc(m.interpretation || '')}</div>` :
      `<div class="note">No predictive model was trained: ${esc(m.reason || 'insufficient data')}.</div>`}
      <h3 style="font-size:13px;margin:18px 0 6px">Not modelled, on purpose</h3>
      <ul class="clean">${Object.entries(m.unsupported_models || {}).map(([k,v]) =>
        `<li><b class="mono">${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
    </div>

    <div class="section-title"><h2>Limitations</h2></div>
    <div class="card"><ul class="clean">${D.limitations.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>

    <div class="section-title"><h2>Feature dictionary</h2>
      <span class="hint">${Object.keys(D.feature_documentation).length} documented features</span></div>
    <div class="tablewrap"><table><thead><tr><th>Feature</th><th>Definition</th></tr></thead><tbody>
      ${Object.entries(D.feature_documentation).map(([k,v]) =>
        `<tr><td class="mono">${esc(k)}</td><td class="wrap">${esc(v)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ------------------------------------------------------- assistant (local) */
const ASSISTANT_TOOLS = [
  {name:'high_risk_districts', patterns:[/district.*(high[- ]?risk|risk)/i, /(high[- ]?risk).*district/i],
   run: () => {
     const rows = D.districts.slice().sort((a,b) => (b.high_risk_works||0)-(a.high_risk_works||0)).slice(0,10);
     return {text:'Districts with the most high or critical risk works:\n' + rows.map((r,i) =>
       `  ${i+1}. ${r.ida_district} (${r.state}) — ${n0(r.high_risk_works)} flagged of ${n0(r.works_recommended + r.works_completed)} works, mean risk ${n1(r.risk_score)}`).join('\n')};
   }},
  {name:'cost_anomalies', patterns:[/cost anomal/i, /unusually high cost/i, /high(est)? cost/i, /cost deviation/i],
   run: () => {
     const rows = D.top_works.slice().sort((a,b) => b.cost_risk-a.cost_risk).slice(0,10);
     return {text:'Works deviating most from comparable official records on cost:\n' + rows.map((r,i) =>
       `  ${i+1}. ${r.work_uid} — ${money(r.amount)} (${n1(r.state_category_ratio_to_peer)}× peer median) in ${r.ida_district}, ${r.state}; cost risk ${n1(r.cost_risk)}/100`).join('\n')};
   }},
  {name:'state_anomaly_rates', patterns:[/state.*(anomaly|risk) rate/i, /which states/i, /states.*(highest|most)/i],
   run: () => {
     const rows = D.states.filter(s => s.works >= 100)
       .map(s => ({...s, pct: 100*s.high_risk/s.works})).sort((a,b) => b.pct-a.pct).slice(0,10);
     return {text:'States by share of works in the high or critical bands:\n' + rows.map((r,i) =>
       `  ${i+1}. ${r.state} — ${r.pct.toFixed(2)}% (${n0(r.high_risk)} of ${n0(r.works)} works)`).join('\n')};
   }},
  {name:'delayed_works', patterns:[/delay/i, /stalled/i, /long.?(open|pending)/i, /pending work/i],
   run: () => {
     const rows = D.top_works.filter(w => w.work_stage === 'RECOMMENDED')
       .slice().sort((a,b) => b.age_days-a.age_days).slice(0,10);
     return {text:'Longest-open recommended works with no completion record:\n' + rows.map((r,i) =>
       `  ${i+1}. ${r.work_uid} — open ${n0(r.age_days)} days, ${money(r.amount)}, ${r.ida_district}, ${r.state}`).join('\n')};
   }},
  {name:'vendor_concentration', patterns:[/vendor/i, /contractor/i, /supplier/i],
   run: () => {
     const rows = D.vendors.slice(0,10);
     return {text:'Vendors with the strongest concentration signals:\n' + rows.map((r,i) =>
       `  ${i+1}. ${r.vendor} — ${pct(100*r.vendor_district_share)} of payments in ${r.ida_district}, ${n0(r.vendor_payment_lines)} lines, ${money(r.vendor_total_amount)}; risk ${n1(r.composite_risk)}/100`).join('\n')};
   }},
  {name:'duplicate_works', patterns:[/duplicate/i, /similar (project|work)/i, /repeated (work|description)/i],
   run: () => {
     const rows = D.duplicate_pairs.slice(0,10);
     return {text:'Closest near-duplicate work pairs:\n' + rows.map((r,i) =>
       `  ${i+1}. ${(100*r.similarity).toFixed(1)}% — "${String(r.left_description).slice(0,60)}" ↔ "${String(r.right_description).slice(0,60)}" (${money(r.left_amount)} vs ${money(r.right_amount)}, ${r.state})`).join('\n')};
   }},
  {name:'mp_utilisation', patterns:[/utilis|utiliz/i, /unspent/i, /fund.*(use|spend)/i],
   run: () => {
     const rows = D.mps.filter(m => m.allocated_amount > 0)
       .slice().sort((a,b) => a.utilization_pct-b.utilization_pct).slice(0,10);
     return {text:'MPs with the lowest published fund utilisation:\n' + rows.map((r,i) =>
       `  ${i+1}. ${r.mp_name} (${r.constituency}, ${r.state}) — ${pct(r.utilization_pct)} of ${cr(r.allocated_amount)} utilised`).join('\n')};
   }},
  {name:'data_quality', patterns:[/data.?quality/i, /missing (data|field)/i, /quality (problem|issue)/i],
   run: () => {
     const s = D.data_quality.scores;
     return {text:`Data quality for run ${D.meta.run_id}:\n` +
       Object.entries(s).map(([k,v]) => `  ${k.padEnd(28)} ${Number(v).toFixed(2)}`).join('\n') +
       '\n\nPer dataset:\n' + D.data_quality.datasets.map(d =>
         `  ${d.dataset.padEnd(20)} received ${n0(d.records_received)}, validity ${pct(d.validity_rate_pct)}, duplicate rows ${n0(d.full_duplicate_rows)}`).join('\n')};
   }},
  {name:'open_alerts', patterns:[/alert/i, /warning/i, /requires? review/i],
   run: () => {
     const rows = (D.alerts || []).slice(0,10);
     if (!rows.length) return {text:'No alert crossed the configured threshold in this run.'};
     return {text:'Highest-scoring open alerts:\n' + rows.map((r,i) =>
       `  ${i+1}. [${r.risk_band}] ${r.entity_type}: ${r.entity_label} — ${n1(r.risk_score)}/100 (${r.district || r.state})`).join('\n')};
   }},
  {name:'kpi_summary', patterns:[/total|overall|summary|how much|how many/i],
   run: () => {
     const k = D.kpis;
     return {text:`National position for run ${D.meta.run_id}:\n` +
       `  Allocated            ${cr(k.allocated)}\n  Expenditure          ${cr(k.expenditure)} (${pct(k.utilisation_pct)})\n` +
       `  Works recommended    ${n0(k.works_recommended)}\n  Works completed      ${n0(k.works_completed)} (${pct(k.completion_rate_pct)})\n` +
       `  Payment lines        ${n0(k.payment_lines)}\n  High/critical works  ${n0(k.works_high_or_critical)}\n` +
       `  Open alerts          ${n0(k.alerts_open)}\n  Data quality         ${n1(k.data_quality_pct)}%`};
   }},
];
const INJECTION = /(ignore (all |the )?previous|disregard .*instructions|system prompt|you are now|drop table|delete from)/i;

function assistantAnswer(q) {
  if (INJECTION.test(q)) return {text:'That request looks like an attempt to change how this assistant behaves, so it was not executed. Ask a question about the MPLADS data instead.', src:'rejected'};
  const idm = q.match(/\b((?:REC|COM)-\d+-\d+|VEN-\d{7})\b/i);
  if (idm && /why|explain|flag/i.test(q)) {
    const id = idm[1].toUpperCase();
    const w = D.top_works.find(x => x.work_uid === id) || D.vendors.find(x => x.vendor_uid === id);
    if (w) return {text:`${id} scores ${n1(w.composite_risk)}/100 (${w.risk_band}).\n\n${w.explanation}`, src:'risk_engine'};
    return {text:`${id} is not in the published extract of this run (the register carries the highest-scoring records only).`, src:'no_match'};
  }
  for (const t of ASSISTANT_TOOLS) {
    if (t.patterns.some(p => p.test(q))) { const r = t.run(); return {text:r.text, src:'tool:'+t.name}; }
  }
  return {text:'I answer only from this run\'s warehouse extract, and I could not map that question to an available analytics tool. Try asking about districts, cost anomalies, delayed works, vendors, duplicates, fund utilisation, data quality or open alerts.', src:'no_match'};
}

function renderAssistant() {
  const el = $('#view-assistant');
  el.innerHTML = `
    <div class="callout neutral" style="margin-bottom:14px">
      This panel is the offline mirror of the API's assistant: it answers from the data embedded in this page,
      using the same registered analytics tools. It cannot invent a statistic — every answer is a query result.
      In the deployed platform the same questions run against the live warehouse, and any model-generated SQL
      passes a guard that permits SELECT statements on whitelisted tables only.
    </div>
    <div class="card">
      <div class="chat" id="chat"></div>
      <div class="controls" style="margin:14px 0 0">
        <input type="text" id="ask" placeholder="Ask about the MPLADS data…" style="flex:1;min-width:260px">
        <button class="iconbtn" id="ask-send">Ask</button>
      </div>
      <div class="suggest" id="suggest">
        ${['Which districts have the highest number of high-risk projects?','Show projects with cost anomalies.',
           'Which states have the highest anomaly rates?','Show delayed projects.',
           'Find duplicate works.','Which MPs have the lowest fund utilisation?',
           'What are the major data-quality problems?','Show open alerts.']
          .map(s => `<button>${s}</button>`).join('')}
      </div>
    </div>`;
  const chat = $('#chat', el);
  const push = (text, who, src) => {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = who === 'bot'
      ? `<pre>${esc(text)}</pre>${src?`<div class="src">source: ${esc(src)}</div>`:''}`
      : esc(text);
    chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  };
  const ask = q => { if (!q.trim()) return; push(q, 'user'); const a = assistantAnswer(q); push(a.text, 'bot', a.src); };
  push('Ask me about risk, districts, vendors, duplicates, utilisation, alerts or data quality. I answer only from this run\'s data.', 'bot', 'ready');
  $('#ask-send', el).addEventListener('click', () => { ask($('#ask', el).value); $('#ask', el).value = ''; });
  $('#ask', el).addEventListener('keydown', e => {
    if (e.key === 'Enter') { ask(e.target.value); e.target.value = ''; }
  });
  $$('#suggest button', el).forEach(b => b.addEventListener('click', () => ask(b.textContent)));
}

/* ----------------------------------------------------------------- routing */
const VIEWS = {
  overview: ['Ministry overview', 'National position, programme flow and where risk concentrates', renderOverview],
  risk: ['Risk register', 'Highest-scoring works, each with its own written explanation', renderRisk],
  alerts: ['Alerts', 'Records that crossed the configured alert threshold', renderAlerts],
  states: ['States & districts', 'Geographic distribution of spending, completion and risk', renderStates],
  mps: ['Members of Parliament', 'Constituency portfolios by utilisation, completion and risk', renderMPs],
  vendors: ['Vendors & agencies', 'Payment concentration around individual suppliers', renderVendors],
  duplicates: ['Duplicate works', 'Near-identical work descriptions found by text similarity', renderDuplicates],
  quality: ['Data quality', 'What arrived, what was valid, and what reconciles', renderQuality],
  method: ['Method & lineage', 'How every number on this dashboard was produced', renderMethod],
  assistant: ['Analytics assistant', 'Questions answered from the warehouse only', renderAssistant],
};
const rendered = new Set();
function go(name) {
  const [title, crumb, render] = VIEWS[name];
  $$('.view').forEach(v => v.classList.remove('active'));
  $('#view-' + name).classList.add('active');
  $$('.navitem').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === name)));
  $('#view-title').textContent = title;
  $('#view-crumb').textContent = crumb;
  if (!rendered.has(name)) { render(); rendered.add(name); }
  window.scrollTo({top:0, behavior:'instant'});
}
$$('.navitem').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

/* ------------------------------------------------------------------- boot */
(function boot() {
  $('#provenance').innerHTML = `
    <span class="chip ${D.meta.portal_reachable ? 'ok' : 'warn'}">
      ${D.meta.portal_reachable ? 'live portal ingest' : 'official export ' + esc(D.meta.snapshot_version)}</span>
    <span class="chip">data to ${esc(D.meta.snapshot_date)}</span>
    <span class="chip">risk engine v${esc(D.meta.risk_engine_version)}</span>
    <span class="chip">${esc(D.meta.run_id)}</span>`;
  $('#foot-run').textContent = D.meta.run_id;
  $('#nav-risk').textContent = n0(D.kpis.works_high_or_critical);
  $('#nav-alerts').textContent = n0(D.kpis.alerts_open);
  $('#nav-dupes').textContent = n0(D.kpis.duplicate_pairs);
  const toggle = $('#theme-toggle');
  toggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
    rendered.clear();
    const active = $$('.navitem').find(b => b.getAttribute('aria-current') === 'true');
    go(active ? active.dataset.view : 'overview');
  });
  go('overview');
})();
</script>
